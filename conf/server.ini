; ============================================================
; mc_forward 服务端配置（主机 B：TCP 服务端 + 组播发送方）
; 用法: mc_forward_b.exe -c conf\server.ini
; 注意: 同机自测时，本文件的发送组/端口必须与客户端的接收组/端口不同，
;       否则会形成转发环路（或把 multicast.loop 置为 false）
; ============================================================

[listen]
; 0.0.0.0 表示监听所有网卡；也可填 172.16.5.213 只监听该网卡
host = 0.0.0.0
port = 25000

[multicast]
; 转发出去的目标组播组
group = 239.255.10.129
port = 9302
; 出口网卡的 IPv4 地址（B 本机，必须改成 B 侧实际发送组播的网卡）
interface = 172.16.5.213
ttl = 1
; 同机调试时保持 true，便于本机自收验证
loop = true

[auth]
; 必须与客户端一致
password = change-me

[runtime]
; 超过该秒数未收到客户端任何帧即判定失联
heartbeat_timeout = 30
stats_interval = 5
log_level = info
; 留空或不写表示只输出到控制台
; log_file = logs/server.log
