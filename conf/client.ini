; ============================================================
; mc_forward 客户端配置（主机 A：组播接收方 + TCP 客户端）
; 用法: mc_forward_a.exe -c conf\client.ini
; ============================================================

[multicast]
; 要加入并接收的组播组（现场实际数据源）
group = 239.255.10.128
port = 9302
; 入组网卡的 IPv4 地址（本机，A 侧从这张网卡收组播）
interface = 192.168.1.66

[server]
; 服务端（主机 B）的 TCP 地址
host = 172.16.5.213
port = 25000

[auth]
; 必须与服务端一致；只从配置文件读取，不走命令行
password = change-me

[runtime]
queue_size = 1024
reconnect_min = 1
reconnect_max = 30
heartbeat_interval = 10
stats_interval = 5
log_level = info
; 留空或不写表示只输出到控制台
; log_file = logs/client.log
