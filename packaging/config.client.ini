; 客户端配置模板（主机 A）
; 用法：把本文件复制为 config.ini，程序启动时自动加载；
;       也可在界面用【文件 → 导入配置】选择本文件，导入后自动保存为 config.ini

[app]
role = client

[multicast]
group = 239.255.10.128
port = 9302
interface = 192.168.1.66
ttl = 1
loop = true

[server]
host = 172.16.5.213
port = 25000

[listen]
host = 0.0.0.0
port = 25000

[auth]
password = change-me

[runtime]
queue_size = 1024
reconnect_min = 1
reconnect_max = 30
heartbeat_interval = 10
heartbeat_timeout = 30
stats_interval = 5
log_level = info
